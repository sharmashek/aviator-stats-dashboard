const express = require('express');
const session = require('express-session');
const path = require('path');
const sqlite3 = require('sqlite3').verbose();
const bcrypt = require('bcryptjs');

const app = express();
const PORT = process.env.PORT || 3000;
const db = new sqlite3.Database('./data.db');

app.use(express.json());
app.use(express.urlencoded({ extended: true }));
app.use(
  session({
    secret: 'aviator-stats-secret-change-me',
    resave: false,
    saveUninitialized: false,
    cookie: { httpOnly: true, maxAge: 1000 * 60 * 60 * 8 }
  })
);
app.use(express.static(path.join(__dirname, 'public')));

function requireAuth(req, res, next) {
  if (!req.session.userId) {
    return res.status(401).json({ error: 'Unauthorized' });
  }
  next();
}

function ensureTables() {
  db.serialize(() => {
    db.run(`
      CREATE TABLE IF NOT EXISTS users (
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        name TEXT NOT NULL,
        email TEXT NOT NULL UNIQUE,
        password_hash TEXT NOT NULL,
        created_at DATETIME DEFAULT CURRENT_TIMESTAMP
      )
    `);

    db.run(`
      CREATE TABLE IF NOT EXISTS rounds (
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        user_id INTEGER NOT NULL,
        multiplier REAL NOT NULL,
        result TEXT NOT NULL CHECK(result IN ('win', 'loss')),
        stake REAL DEFAULT 0,
        created_at DATETIME DEFAULT CURRENT_TIMESTAMP,
        FOREIGN KEY(user_id) REFERENCES users(id)
      )
    `);
  });
}

ensureTables();

app.get('/', (req, res) => {
  if (req.session.userId) {
    return res.redirect('/dashboard');
  }
  res.redirect('/login');
});

app.get('/login', (req, res) => {
  res.sendFile(path.join(__dirname, 'public', 'login.html'));
});

app.get('/register', (req, res) => {
  res.sendFile(path.join(__dirname, 'public', 'register.html'));
});

app.get('/dashboard', (req, res) => {
  if (!req.session.userId) {
    return res.redirect('/login');
  }
  res.sendFile(path.join(__dirname, 'public', 'dashboard.html'));
});

app.get('/logout', (req, res) => {
  req.session.destroy(() => {
    res.redirect('/login');
  });
});

app.post('/register', async (req, res) => {
  const { name, email, password } = req.body || {};

  if (!name || !email || !password) {
    return res.status(400).json({ error: 'Name, email and password are required.' });
  }

  if (String(password).length < 6) {
    return res.status(400).json({ error: 'Password must be at least 6 characters.' });
  }

  const passwordHash = await bcrypt.hash(password, 10);

  db.run(
    'INSERT INTO users (name, email, password_hash) VALUES (?, ?, ?)',
    [name.trim(), email.trim().toLowerCase(), passwordHash],
    function (err) {
      if (err) {
        if (err.message.includes('UNIQUE')) {
          return res.status(409).json({ error: 'Email already in use.' });
        }
        return res.status(500).json({ error: 'Registration failed.' });
      }

      return res.status(201).json({ message: 'User created successfully.' });
    }
  );
});

app.post('/login', (req, res) => {
  const { email, password } = req.body || {};

  if (!email || !password) {
    return res.status(400).json({ error: 'Email and password are required.' });
  }

  db.get(
    'SELECT * FROM users WHERE email = ?',
    [String(email).trim().toLowerCase()],
    async (err, user) => {
      if (err) {
        return res.status(500).json({ error: 'Login failed.' });
      }

      if (!user) {
        return res.status(401).json({ error: 'Invalid credentials.' });
      }

      const match = await bcrypt.compare(password, user.password_hash);
      if (!match) {
        return res.status(401).json({ error: 'Invalid credentials.' });
      }

      req.session.userId = user.id;
      return res.json({ message: 'Logged in successfully.' });
    }
  );
});

app.get('/api/stats', requireAuth, (req, res) => {
  db.all(
    'SELECT * FROM rounds WHERE user_id = ? ORDER BY created_at DESC LIMIT 20',
    [req.session.userId],
    (err, rounds) => {
      if (err) {
        return res.status(500).json({ error: 'Could not load stats.' });
      }

      const totalRounds = rounds.length;
      const wins = rounds.filter((round) => round.result === 'win').length;
      const winRate = totalRounds ? ((wins / totalRounds) * 100).toFixed(1) : '0.0';
      const averageMultiplier = totalRounds
        ? (rounds.reduce((sum, r) => sum + Number(r.multiplier), 0) / totalRounds).toFixed(2)
        : '0.00';
      const bestMultiplier = totalRounds
        ? Math.max(...rounds.map((r) => Number(r.multiplier))).toFixed(2)
        : '0.00';

      return res.json({
        totalRounds,
        winRate,
        averageMultiplier,
        bestMultiplier,
        recentRounds: rounds
      });
    }
  );
});

app.post('/api/rounds', requireAuth, (req, res) => {
  const { multiplier, result, stake } = req.body || {};

  if (!multiplier || !result) {
    return res.status(400).json({ error: 'Multiplier and result are required.' });
  }

  if (!['win', 'loss'].includes(result)) {
    return res.status(400).json({ error: 'Result must be win or loss.' });
  }

  const parsedMultiplier = Number(multiplier);
  const parsedStake = Number(stake || 0);

  if (Number.isNaN(parsedMultiplier) || parsedMultiplier <= 0) {
    return res.status(400).json({ error: 'Multiplier must be a positive number.' });
  }

  db.run(
    'INSERT INTO rounds (user_id, multiplier, result, stake) VALUES (?, ?, ?, ?)',
    [req.session.userId, parsedMultiplier, result, parsedStake],
    function (err) {
      if (err) {
        return res.status(500).json({ error: 'Could not save round.' });
      }

      return res.status(201).json({ message: 'Round saved.' });
    }
  );
});

app.listen(PORT, () => {
  console.log(`Aviator stats app running at http://localhost:${PORT}`);
});

module.exports = app;
